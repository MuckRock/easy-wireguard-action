name: Easy WireGuard Connection
description: Easy WireGuard Connection Setup

inputs:
  WG_CONFIG_FILE:
    description: WireGuard (wg-quick) configuration file
    required: true

runs:
    using: composite
    steps:
        - run: |
              sudo apt-get install -y wireguard resolvconf
              # Write config outside the repo checkout, then move it into the root-only /etc/wireguard
              echo "$WG_CONFIG" > "$RUNNER_TEMP/wg0.conf"
              sudo mv "$RUNNER_TEMP/wg0.conf" /etc/wireguard/
              sudo chmod 600 /etc/wireguard/wg0.conf
              echo "setting config"
              # Hide wg-quick output so tunnel IPs aren't logged
              sudo wg-quick up wg0 > /dev/null 2>&1
          shell: bash
          env:
            WG_CONFIG: ${{ inputs.WG_CONFIG_FILE }}

branding:
  icon: shield
  color: red
